<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 미리보기 · 새벽 한 시, 달의 뒷면</title>
<style>
  body { margin: 0; background: #120d0f; color: #f4ead9; font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif; }
  .wrap { display: flex; gap: 24px; padding: 24px; align-items: flex-start; flex-wrap: wrap; }
  .phone { width: 390px; height: 844px; border-radius: 44px; border: 10px solid #2a1f1c; box-shadow: 0 30px 60px rgba(0,0,0,.55); overflow: hidden; background: #000; flex: 0 0 auto; }
  .phone iframe { width: 390px; height: 844px; border: 0; }
  .phone.small { width: 360px; height: 740px; }
  .phone.small iframe { width: 360px; height: 740px; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .08em; margin: 0 0 4px; }
  p { font-size: 12px; line-height: 1.7; color: #b09a86; margin: 0 0 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>iPhone 14 (390 × 844)</h1>
    <p>아래 화면에서 직접 플레이할 수 있습니다.</p>
    <div class="phone"><iframe src="../index.html?v=m1" title="mobile preview"></iframe></div>
  </div>
  <div>
    <h1>iPhone SE (360 × 740)</h1>
    <p>작은 화면에서 대사창·버튼이 겹치지 않는지 확인합니다.</p>
    <div class="phone small"><iframe src="../index.html?v=m2" title="small preview"></iframe></div>
  </div>
</div>
</body>
</html>
